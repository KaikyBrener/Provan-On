<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizando Prova - ApiProvaOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../assets/css/global.css" rel="stylesheet">
    <style>
        .prova-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .opcao-label {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--card-bg);
        }
        .opcao-label:hover {
            border-color: var(--primary-color);
            background-color: rgba(59, 91, 219, 0.05);
        }
        input[type="radio"]:checked + .opcao-label {
            border-color: var(--primary-color);
            background-color: rgba(59, 91, 219, 0.1);
        }
    </style>
</head>
<body data-theme="dark" class="bg-color">
    <!-- Navbar simplificada (sem sidebar) para não distrair o aluno -->
    <nav class="navbar navbar-expand-lg bg-card border-bottom sticky-top py-3" style="background-color: var(--card-bg); border-color: var(--border-color);">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold text-primary mb-0"><i class="bi bi-shield-lock me-2"></i>ApiProva</span>
            <div class="d-flex align-items-center">
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 d-flex align-items-center">
                    <i class="bi bi-stopwatch me-2"></i>
                    <span id="timerDisplay">00:00:00</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="prova-container" id="provaContent">
        <div class="text-center py-5" id="loadingState">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <h5 class="mt-3 text-muted">Carregando avaliação...</h5>
        </div>

        <div class="d-none" id="provaView">
            <div class="card p-4 mb-4 shadow-sm border-0">
                <h3 class="fw-bold text-main" id="tituloProva">Título da Prova</h3>
                <p class="text-muted mb-0">Leia atentamente as instruções antes de responder.</p>
            </div>

            <form id="provaForm">
                <div id="questoesLista">
                    <!-- Injetado dinamicamente -->
                </div>

                <div class="card p-4 border-0 bg-transparent shadow-none text-end mt-4">
                    <button type="button" class="btn btn-lg btn-success px-5 fw-bold shadow" id="finalizarBtn">
                        <i class="bi bi-check2-circle me-2"></i>Finalizar e Enviar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Finalizar -->
    <div class="modal fade" id="confirmSubmitModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--card-bg);">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Entregar Prova</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Você tem certeza de que deseja entregar a avaliação? Após a entrega, você não poderá alterar suas respostas.</p>
                    <p class="mb-0 text-warning d-none fw-bold" id="unansweredWarning"><i class="bi bi-exclamation-triangle me-1"></i> Atenção: Existem questões sem resposta.</p>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Revisar Respostas</button>
                    <button type="button" class="btn btn-success" id="confirmSubmitAction">Entregar Definitivamente</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="prova.js"></script>
</body>
</html>
