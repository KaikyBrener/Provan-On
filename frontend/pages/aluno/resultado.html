<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - ApiProvaOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../assets/css/global.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
</head>
<body data-theme="dark">
    <div class="d-flex align-items-center justify-content-center min-vh-100" style="background: var(--bg-body)">
        <div class="main-wrapper w-100">

            <main class="content-area d-flex align-items-center justify-content-center">
                <div class="card p-5 text-center shadow-lg" style="max-width: 600px; width: 100%;" id="resultadoCard">
                    <div class="text-center py-5" id="loadingState">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                        <h5 class="mt-3 text-muted">Calculando resultado...</h5>
                    </div>

                    <div class="d-none" id="resultadoView">
                        <div class="mb-4" id="iconContainer">
                            <i class="bi bi-trophy text-success" style="font-size: 5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Avaliação Concluída!</h2>
                        <h5 class="text-muted mb-4" id="tituloProva">Título da Prova</h5>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="p-3 bg-dark border border-secondary rounded h-100">
                                    <small class="text-muted d-block mb-1">Nota Parcial</small>
                                    <h3 class="fw-bold text-main mb-0" id="notaFinal">--</h3>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 bg-dark border border-secondary rounded h-100">
                                    <small class="text-muted d-block mb-1">Acertos / Erros</small>
                                    <h3 class="fw-bold text-main mb-0">
                                        <span id="acertosCount" class="text-success">--</span> / 
                                        <span id="errosCount" class="text-danger">--</span>
                                    </h3>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <div class="p-3 bg-dark border border-warning rounded">
                                    <small class="text-warning d-block mb-1">Discursivas Pendentes de Correção</small>
                                    <h4 class="fw-bold text-main mb-0" id="pendentesCount">--</h4>
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-info border-0 mb-4 text-start">
                            <i class="bi bi-info-circle me-2"></i><strong>Aviso:</strong> Esta é sua nota parcial. A nota final estará disponível após a correção das questões discursivas pelo professor.
                        </div>
                        
                        <a href="codigo-acesso.html" class="btn btn-primary btn-lg w-100 fw-bold">Voltar ao Início</a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="resultado.js"></script>
</body>
</html>
